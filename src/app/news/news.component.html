<div class="col-md-12">
    <div class="container post-container">
        <app-auth-navbar></app-auth-navbar>
        <div class="container-content">
            <h5 class="font-weight-bold py-1">News List</h5>
            <button type="button" (click)="onViewGallery()" class="btn btn-primary mt-2 mb-2 float-left">Gallery</button>
            <button type="button" class="btn btn-primary mt-2 mb-2 float-right" (click)="onAdd()">Add Item</button>
            <form>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Name</th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="news">
                        <tr *ngFor="let record of news.list; index as i">
                            <th scope="row">{{ currentPageSize + i + 1 }}</th>
                            <td>{{ record?.title }}</td>
                            <td>
                                <a class="text-primary font-weight-bold" (click)="OnView(record?.associatedFile)" *ngIf="record?.associatedFile">View</a>
                                <a class="text-primary font-weight-bold ml-2" (click)="OnDelete(record._id)">Delete</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="d-flex justify-content-between p-2 pagination" *ngIf="news">
                    <ngb-pagination [collectionSize]="collectionSize" [(page)]="page" [pageSize]="pageSize"
                        (pageChange)="onPageChange($event)">
                    </ngb-pagination>
                </div>
            </form>
        </div>
    </div>
</div>
