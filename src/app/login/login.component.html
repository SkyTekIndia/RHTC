<main class="mt--4">
  <section class="section section-shaped section-lg mt--4">
    <div class="shape shape-style-1 bg-gradient-default">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="container pt-lg-md">
      <div class="row justify-content-center">
        <div class="col-lg-5 topBy50">
          <div class="card bg-secondary shadow border-0">
            <div class="card-header bg-white pb-3">
              <div class="text-muted text-center mb-2">
                <strong>SIGN IN</strong>
              </div>
            </div>
            <div class="card-body px-lg-5 py-lg-5">
              <form role="form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <div class="form-group mb-3" [ngClass]="{'focused':focus===true}">
                  <div class="input-group input-group-alternative">
                    <div class="input-group-prepend">
                      <span class="input-group-text"><i class="ni ni-email-83"></i></span>
                    </div>
                    <input class="form-control" placeholder="Email" formControlName="email" type="email"
                      (focus)="focus=true" (blur)="focus=false"
                      [ngClass]="{ 'is-invalid': ((submitted || form.email.touched)  && form.email.invalid) }">
                  </div>
                  <div *ngIf="(submitted || form.email.touched) && form.email.errors" class="text-danger mt-1">
                    <small *ngIf="form.email.errors.required">Email is required<br></small>
                    <small *ngIf="form.email.errors.email">Email must be valid<br></small>
                  </div>
                </div>
                <div class="form-group" [ngClass]="{'focused':focus===true}">
                  <div class="input-group input-group-alternative">
                    <div class="input-group-prepend">
                      <span class="input-group-text"><i class="ni ni-lock-circle-open"></i></span>
                    </div>
                    <input class="form-control" placeholder="Password" type="password" formControlName="password" (focus)="focus=true" (blur)="focus=false"
                    [ngClass]="{ 'is-invalid': ((submitted || form.password.touched)  && form.password.invalid) }">
                  </div>                  
                  <div *ngIf="(submitted || form.password.touched) && form.password.errors" class="text-danger mt-1">
                    <small *ngIf="form.password.errors.required">Password is required<br></small>
                  </div>
                </div>
                <div class="text-center">
                  <button type="submit" class="btn btn-primary my-4">Sign in</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
